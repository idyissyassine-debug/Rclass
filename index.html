<style>
/* Layout: registre d'appel mobile — barre de classe collante, onglets Séance / Bilan / Élèves, lignes élèves à deux étages */
:root{
  --paper:#f3f5f1; --sheet:#ffffff; --ink:#18242b; --muted:#5d6b66; --line:#d9e0da;
  --board:#1f5a47; --board-ink:#eaf3ee;
  --ok:#2f7d4f; --ok-bg:#e3f2e8; --bad:#b4442f; --bad-bg:#f8e4df; --ex:#9a6a07; --ex-bg:#fbf0d6; --late:#6b5bb0; --late-bg:#ece8fa;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Noto Kufi Arabic",system-ui,sans-serif;
  --f-ar:"Noto Kufi Arabic","Atkinson Hyperlegible",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111a17; --sheet:#18231f; --ink:#e7eee9; --muted:#9aaba3; --line:#2b3a34;
  --board:#2c7a60; --board-ink:#f0faf4;
  --ok:#6cc792; --ok-bg:#1d3a2a; --bad:#ef8a73; --bad-bg:#432520; --ex:#e8b84a; --ex-bg:#3a2f14; --late:#b3a6f0; --late-bg:#2c2847; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111a17; --sheet:#18231f; --ink:#e7eee9; --muted:#9aaba3; --line:#2b3a34;
  --board:#2c7a60; --board-ink:#f0faf4;
  --ok:#6cc792; --ok-bg:#1d3a2a; --bad:#ef8a73; --bad-bg:#432520; --ex:#e8b84a; --ex-bg:#3a2f14; --late:#b3a6f0; --late-bg:#2c2847; color-scheme:dark}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--fs,1))}body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:calc(15px * var(--fs,1));line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--board);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board);color:var(--board-ink);
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:6px 6px}
.top .wrap{padding-block:12px 0;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hlogo{width:1.25em;height:1.25em;vertical-align:-.22em;margin-inline-end:6px;border-radius:22%;box-shadow:0 0 0 1.5px rgba(255,255,255,.45)}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:-.01em}
.brand .ar{font-family:var(--f-ar);font-size:.85rem;opacity:.85}
.sync{font-size:.75rem;opacity:.85;white-space:nowrap}
.hdright{display:flex;align-items:center;gap:6px;margin-inline-start:auto}.brand{align-items:center}
.hdbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:var(--board-ink);border-radius:8px;min-width:34px;height:32px;font-size:1rem;font-weight:800;cursor:pointer;line-height:1;padding:0 8px}
.hdinfo{display:none;font-weight:700;font-size:.9rem;min-width:0;white-space:nowrap}
#perTop{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:var(--board-ink);border-radius:8px;padding:4px 4px;font-weight:700;font-size:.8rem;height:32px}#perTop option{color:#18242b}
.brand{flex-wrap:wrap;row-gap:4px}
@media (max-width:384px){header.top.mini .hdtab{display:none}}
@media (max-width:480px){header.top.mini .brand h1{display:none}.hdnav{margin-inline-start:2px;gap:2px}.hdtab{min-width:44px;font-size:.76rem}#classSelMini{max-width:88px;font-size:.8rem;padding:4px 2px}
 .hdright{gap:4px}.hdright .hdbtn{min-width:30px;padding:0 6px}#perTop{max-width:74px;font-size:.76rem;padding:2px}.sync{display:none}header.top.mini .brand{flex-wrap:nowrap}}
#classSelMini{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:var(--board-ink);border-radius:8px;padding:4px 6px;font-weight:700;font-size:.9rem;max-width:150px}#classSelMini option{color:#18242b}
.hdtab{opacity:.9;font-size:.85rem;min-width:58px;text-align:center}
.hdnav{display:inline-flex;align-items:center;gap:4px;margin-inline-start:8px}.hdnav .hdbtn{min-width:28px;height:28px;padding:0 6px;font-size:1.1rem}
header.top.mini .hdinfo{display:flex!important;align-items:center}
header.top.mini .wrap{padding-block:6px;gap:0}header.top.mini .brand h1{font-size:1rem}header.top.mini .brand .ar,header.top.mini .bar,header.top.mini .hprog,header.top.mini .tabs{display:none!important}
header.top.mini .hdinfo{display:block;flex:1}header.top.mini .sync{display:none}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar select,.bar input[type=date]{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 9px;color:var(--board-ink);min-width:0}
.bar select{flex:1 1 160px}.bar select option{color:#18242b}
.datebox{display:flex;align-items:center;gap:4px;flex:1 1 200px}
.datebox input{flex:1}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:8px;width:36px;height:36px;color:var(--board-ink);font-size:1.1rem;line-height:1}
.tabs{display:flex;gap:2px}
.hprog{display:grid;gap:4px}
.hprog .hl1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:.86rem}
.hprog .hl1 b{font-family:var(--f-display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.hbar{height:9px;background:rgba(255,255,255,.18);border-radius:5px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--board-ink);border-radius:5px}
.hprog .hl2{font-size:.8rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button{flex:1;min-width:0;display:grid;gap:1px;font-size:.84rem;background:none;border:0;padding:8px 2px 9px;color:var(--board-ink);opacity:.7;font-weight:700;border-bottom:3px solid transparent}
.tabs button small{font-family:var(--f-ar);font-weight:500;font-size:.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sessbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sessbar select{flex:1 1 200px;min-width:0;background:var(--sheet);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-weight:700}
.past{background:var(--late-bg);color:var(--late);border-radius:10px;padding:9px 14px;font-weight:700;font-size:.88rem}
.tabs button[aria-selected=true]{opacity:1;border-color:var(--board-ink)}

main .wrap{padding-block:16px 48px;display:grid;gap:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:0;overflow:hidden}
.summary div{padding:10px 8px;text-align:center;border-right:1px solid var(--line)}
.summary div:last-child{border-right:0}
.summary b{display:block;font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.summary span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:9px;padding:8px 12px;font-weight:700}
.btn.primary{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[aria-pressed=true]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.hint{font-size:.82rem;color:var(--muted)}

.roll{list-style:none;margin:0;padding:0}
.roll li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.roll li:last-child{border-bottom:0}
.roll .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;text-align:right}
.roll .name{font-weight:700;overflow-wrap:anywhere}
.roll .ctr{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap}
.roll li.abs .name{color:var(--muted);text-decoration:line-through}
.roll li.abs .ctr{opacity:.35;pointer-events:none}
.roll li.flash{animation:fl .5s}
@keyframes fl{from{background:var(--ex-bg)}to{background:transparent}}
.pres{border:0;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.82rem;min-width:84px}
.pres.P{background:var(--ok-bg);color:var(--ok)}.pres.A{background:var(--bad-bg);color:var(--bad)}.pres.R{background:var(--late-bg);color:var(--late)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:6px 10px;border:1px solid transparent;font-weight:700;font-size:.88rem;min-height:36px}
.chip .v{font-variant-numeric:tabular-nums;min-width:1.2ch;text-align:center;font-family:var(--f-display);font-size:1rem}
.chip.ex{background:var(--ex-bg);color:var(--ex)}.chip.plus{background:var(--ok-bg);color:var(--ok)}.chip.minus{background:var(--bad-bg);color:var(--bad)}
.chip.zero .v{opacity:.45}
.undo .chip{outline:2px dashed currentColor;outline-offset:-2px}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--sheet)}
td.l,th.l{text-align:left;white-space:normal;min-width:130px}
td.note{font-family:var(--f-display);font-weight:800;font-size:1rem}
.g{color:var(--ok)}.r{color:var(--bad)}.y{color:var(--ex)}
.bar20{height:4px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}
.bar20 i{display:block;height:100%;background:var(--board)}

.form{display:grid;gap:10px;padding:14px}
.form h2{font-family:var(--f-display);font-size:1.1rem;margin:0}
.form label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.form input,.form textarea,.form select{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);width:100%}
.form textarea{min-height:120px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.grid2>*{min-width:0}.form select,.form input{min-width:0;max-width:100%}
.studlist{list-style:none;margin:0;padding:0}
.studlist li{display:flex;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}

const DEF={wEx:1,wPlus:1,wNr:0.5,wMinus:1,base:10,step:0.5,latePen:0.5,cahAbs:1,cahInc:0.5};

const S={classes:{},days:{},cid:null,date:today(),tab:"seance",undo:false,sort:{k:"n",d:1},confirmDel:false,pick:null,store:"…",mode:"plan",selStu:null,edSeat:null,edStu:null,follow:true,lastD:1,lastE:"",xid:null,addF:null,wk:null,stu:null,xScope:"all",period:"year",prog:{},pgLvl:null,cancelOpen:false,holEdit:{}};

function fsCycle(){const i=FSL.indexOf(S.fs||1);S.fs=FSL[(i+1)%FSL.length];fsApply();saveUI();toast("Taille du texte : "+Math.round(S.fs*100)+" %")}
async function saveNow(silent){clearTimeout(queueDay.t);try{await flush()}catch(e){}const c=cls();if(c&&api)await saveClass(c);if(!silent)toast(pending.size?"Enregistrement en attente (connexion)…":"✓ Enregistré")}
async function syncNow(){if(!api)return;setSync("Synchronisation…");await saveNow(true);
  if(api.cloud&&FB.F&&FB.fs){try{await FB.F.disableNetwork(FB.fs);await FB.F.enableNetwork(FB.fs);if(navigator.onLine&&FB.F.waitForPendingWrites)await Promise.race([FB.F.waitForPendingWrites(FB.fs),new Promise(r=>setTimeout(r,8000))])}catch(e){console.warn(e)}}
  setSync(api.label);toast(api.cloud?(navigator.onLine?"☁️ Synchronisé avec vos autres appareils":"Hors ligne : envoi automatique au retour d'Internet"):"✓ Données enregistrées sur cet appareil")}
$("#sync").addEventListener("click",async()=>{setSync("Enregistrement…");try{await Promise.race([saveNow(true),new Promise(r=>setTimeout(r,4000))])}catch(e){}location.reload()});$("#fsBtn").addEventListener("click",fsCycle);fsApply();
async function saveFile(name,blob){const dl=window.claude?await window.claude.use("downloads").catch(()=>null):null;
  if(dl){try{await dl.save({filename:name,data:blob});return true}catch(e){toast("Téléchargement annulé");return false}}
  try{const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Fichier enregistré dans Téléchargements");return true}catch(e){toast("Téléchargement impossible");return false}}

/* ---------- Stockage : db partagé, sinon ce navigateur ---------- */
let api=null;
function localApi(){
  const K="rc-local"+PSUF;let D;try{D=JSON.parse(localStorage.getItem(K)||"null")}catch(e){}
  D=D||(window.__SEED&&!PSUF?JSON.parse(JSON.stringify(window.__SEED)):{classes:{},days:{}});
  const persist=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}try{window.__rcChanged&&window.__rcChanged()}catch(e){}};
  let cC=null,cD=null,cur=null,cP=null,cK=null;
  return {
    subClasses(cb){cC=cb;cb(JSON.parse(JSON.stringify(D.classes)))},
    subDays(cid,cb){cur=cid;cD=cb;cb(JSON.parse(JSON.stringify(D.days[cid]||{})));return()=>{cD=null}},
    async saveClass(cid,data){D.classes[cid]=data;persist();cC&&cC(JSON.parse(JSON.stringify(D.classes)))},
    async deleteClass(cid){delete D.classes[cid];delete D.days[cid];persist();cC&&cC(JSON.parse(JSON.stringify(D.classes)))},
    async saveDay(cid,date,data){(D.days[cid]=D.days[cid]||{})[date]=data;persist()},
    async deleteDay(cid,date){if(D.days[cid])delete D.days[cid][date];persist()},
    async getDays(cid){return JSON.parse(JSON.stringify(D.days[cid]||{}))},
    subProgramme(cb){cP=cb;cb(JSON.parse(JSON.stringify(D.programme||{})))},
    subCalendar(cb){cK=cb;cb(JSON.parse(JSON.stringify(D.calendar||{})))},
    async saveCalendar(data){D.calendar=data;persist();cK&&cK(JSON.parse(JSON.stringify(data)))},
    async saveProgramme(lv,data){D.programme=D.programme||{};D.programme[lv]=data;persist();cP&&cP(JSON.parse(JSON.stringify(D.programme)))},
    async exportAll(){return {app:"registre-classe",v:1,classes:D.classes,days:D.days,programme:D.programme||{},calendar:D.calendar||{}}},
    async replaceAll(B){D={classes:B.classes||{},days:B.days||{},programme:B.programme||D.programme||{},calendar:B.calendar||D.calendar||{}};persist();cC&&cC(JSON.parse(JSON.stringify(D.classes)));cP&&cP(JSON.parse(JSON.stringify(D.programme||{})))},
    local:true,
    async restore(B){for(const cid in B.classes){D.classes[cid]=B.classes[cid];D.days[cid]={...(D.days[cid]||{}),...((B.days||{})[cid]||{})}}if(B.programme)D.programme={...(D.programme||{}),...B.programme};persist();cC&&cC(JSON.parse(JSON.stringify(D.classes)));cP&&cP(JSON.parse(JSON.stringify(D.programme||{})))},
    label:"Enregistré sur cet appareil"
  };
}
function dbApi(db){
  return {
    subClasses(cb){
      const t=setTimeout(()=>{setSync("Connexion lente…");if(S.store==="…"){S.loadSlow=true;render()}},10000);
      db.collection("classes").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=JSON.parse(JSON.stringify(d.data())));if(!s.metadata.fromCache){clearTimeout(t);setSync("Synchronisé")}S.loadErr=null;S.loadSlow=false;cb(o)},
        e=>{clearTimeout(t);setSync("Erreur de connexion");console.warn(e);S.loadErr=(e&&(e.code||e.message))||String(e);render()});
    },
    subDays(cid,cb){
      return db.collection("classes/"+cid+"/days").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=JSON.parse(JSON.stringify(d.data())));cb(o)},()=>setSync("Erreur de connexion"));
    },
    async saveClass(cid,data){await db.doc("classes/"+cid).set(data)},
    async deleteClass(cid){
      const q=await db.collection("classes/"+cid+"/days").get();
      for(const d of q.docs){await db.doc("classes/"+cid+"/days/"+d.id).delete()}
      await db.doc("classes/"+cid).delete();
    },
    async saveDay(cid,date,data){await db.doc("classes/"+cid+"/days/"+date).set(data)},
    async deleteDay(cid,date){await db.doc("classes/"+cid+"/days/"+date).delete()},
    async replaceAll(B){for(const cid of Object.keys(S.classes)){if(!(B.classes||{})[cid]){const q=await db.collection("classes/"+cid+"/days").get();for(const d of q.docs)await db.doc("classes/"+cid+"/days/"+d.id).delete();await db.doc("classes/"+cid).delete();delete S.classes[cid]}else{const q=await db.collection("classes/"+cid+"/days").get();for(const d of q.docs)if(!((B.days||{})[cid]||{})[d.id])await db.doc("classes/"+cid+"/days/"+d.id).delete()}}
      await this.restore(B);Object.assign(S.classes,JSON.parse(JSON.stringify(B.classes)))},
    async getDays(cid){const col=db.collection("classes/"+cid+"/days");let docs;
      try{docs=(await col.get()).docs}catch(e){docs=await new Promise((ok,ko)=>{let un=null;const t=setTimeout(()=>{un&&un();ko(e)},10000);un=col.onSnapshot(s=>{clearTimeout(t);setTimeout(()=>un&&un(),0);ok(s.docs)},err=>{clearTimeout(t);ko(err)})})}
      const o={};docs.forEach(d=>o[d.id]=JSON.parse(JSON.stringify(d.data())));return o},
    async exportAll(){const days={};for(const cid in S.classes){try{days[cid]=await this.getDays(cid)}catch(e){if(cid===S.cid)days[cid]=JSON.parse(JSON.stringify(S.days));else throw e}}return {app:"registre-classe",v:1,classes:JSON.parse(JSON.stringify(S.classes)),days,programme:JSON.parse(JSON.stringify(S.prog||{})),calendar:{rel:S.holEdit||{},sched:S.sched||null}}},
    subCalendar(cb){db.doc("calendar/holidays").onSnapshot(d=>cb(d.exists?JSON.parse(JSON.stringify(d.data())):{}),()=>{})},
    async saveCalendar(data){await db.doc("calendar/holidays").set(data)},
    subProgramme(cb){db.collection("programme").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=JSON.parse(JSON.stringify(d.data())));cb(o)},()=>{})},
    async saveProgramme(lv,data){await db.doc("programme/"+lv).set(data)},
    async restore(B){if(B.programme)for(const lv in B.programme)await db.doc("programme/"+lv).set(B.programme[lv]);for(const cid in B.classes){await db.doc("classes/"+cid).set(B.classes[cid]);const dd=(B.days||{})[cid]||{};for(const date in dd)await db.doc("classes/"+cid+"/days/"+date).set(dd[date])}},
    label:"Synchronisé"
  };
}

function dayDoc(dd){dd=dd||{};const o={marks:dd.marks||{}};if(dd.lesson)o.lesson=dd.lesson;if(dd.lid){o.lid=dd.lid;o.part=dd.part}if(dd.lid2){o.lid2=dd.lid2;o.part2=dd.part2}if((dd.timers||[]).length)o.timers=dd.timers;if(dd.phase)o.phase=dd.phase;if(dd.phase2)o.phase2=dd.phase2;if(typeof dd.step==="number")o.step=dd.step;if(typeof dd.step2==="number")o.step2=dd.step2;return o}
/* écriture différée d'une séance (une écriture à la fois) */
const pending=new Map();let writing=false;
function queueDay(cid,date){markRec(cid,date);pending.set(cid+"|"+date,[cid,date,cid===S.cid?S.days[date]:null]);setSync("Enregistrement…");clearTimeout(queueDay.t);queueDay.t=setTimeout(flush,600)}
async function flush(){
  if(writing)return;writing=true;
  while(pending.size){
    const [k,[cid,date,ref]]=pending.entries().next().value;pending.delete(k);
    try{const dd=(cid===S.cid&&S.days[date])||ref;if(!dd)continue;await api.saveDay(cid,date,dayDoc(dd))}
    catch(e){setSync("Échec de l'enregistrement");toast(e&&e.code==="quota_exceeded"?"Espace plein : supprimez une ancienne classe.":"Enregistrement impossible. Vérifiez la connexion.");writing=false;return}
  }
  writing=false;setSync(api.label);
}

    else{const ns={...x,num:x.num&&!keep.students.some(y=>y.num===x.num)?x.num:++max};keep.students.push(ns);byName[norm(x.name)]=ns;map[x.id]=x.id}});
  const sk=new Set((keep.slots||[]).map(x=>x.d+"|"+x.s));(dup.slots||[]).forEach(x=>{if(!sk.has(x.d+"|"+x.s)){keep.slots=[...(keep.slots||[]),x];sk.add(x.d+"|"+x.s)}});
  const xmap={};(dup.extras||[]).forEach(x=>{const ex=(keep.extras||[]).find(y=>y.id===x.id||(y.date===x.date&&y.s===x.s&&y.type===x.type));if(ex){xmap["X-"+x.id]="X-"+ex.id;if(!ex.obj&&x.obj)ex.obj=x.obj;if(!ex.dev&&x.dev)ex.dev=x.dev}else{keep.extras=[...(keep.extras||[]),x];xmap["X-"+x.id]="X-"+x.id}});
  keep.cancel={...(dup.cancel||{}),...(keep.cancel||{})};
  if(!keep.layout&&dup.layout)keep.layout=dup.layout;if(!keep.level&&dup.level)keep.level=dup.level;if(!keep.sem2&&dup.sem2)keep.sem2=dup.sem2;
  if(!Object.keys(keep.seats||{}).length&&dup.seats){keep.seats={};for(const k in dup.seats)keep.seats[k]=map[dup.seats[k]]||dup.seats[k]}
  for(const k0 in (dd||{})){const k=xmap[k0]||k0,src=dd[k0]||{},dst=kd[k]=kd[k]||{marks:{}};dst.marks=dst.marks||{};
    for(const sid in (src.marks||{})){const t=map[sid]||sid;const a=dst.marks[t],b=src.marks[sid];if(!a||markW(b)>markW(a))dst.marks[t]=b}

  (dup.exams||[]).forEach(e=>{const ex=(keep.exams||[]).find(y=>y.id===e.id||(e.slot&&y.slot===e.slot)||(!e.slot&&y.title===e.title&&y.date===e.date));if(ex){mergeRes(ex,e);if(!(ex.comps||[]).length&&(e.comps||[]).length)ex.comps=e.comps}else keep.exams=[...(keep.exams||[]),{...e,res:remap(e.res)}]});

/* ---------- Sauvegarde automatique (version hors ligne) ---------- */
const AS={dirty:false,t:null,last:null,file:null,fileName:"",snaps:[],busy:false};
const idb=(()=>{let p=null;const open=()=>p||(p=new Promise((ok,ko)=>{try{const r=indexedDB.open("rclass-auto",1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv")};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}}));
  const op=(mode,fn)=>open().then(db=>new Promise((ok,ko)=>{const tx=db.transaction("kv",mode),st=tx.objectStore("kv");const r=fn(st);tx.oncomplete=()=>ok(r&&r.result);tx.onerror=()=>ko(tx.error)}));
  return {get:k=>op("readonly",st=>st.get(k)),set:(k,v)=>op("readwrite",st=>st.put(v,k))}})();

function asSchedule(){if(!api||!api.local)return;AS.dirty=true;clearTimeout(AS.t);AS.t=setTimeout(asRun,120000);asPaint()}
async function asRun(){if(AS.busy||!AS.dirty)return;AS.busy=true;try{const B=await api.exportAll();const json=JSON.stringify(B);

  if(!prev||prev.json!==json){AS.snaps=[...AS.snaps,{at,json}].slice(-10);await idb.set("snaps"+PSUF,AS.snaps)}
  if(AS.file){try{if((await AS.file.queryPermission({mode:"readwrite"}))==="granted"){const w=await AS.file.createWritable();await w.write(json);await w.close();AS.fileOk=true}else AS.fileOk=false}catch(e){AS.fileOk=false}}
  AS.last=at;AS.dirty=false}catch(e){}AS.busy=false;asPaint()}

function asPaint(){const el=$("#asState");if(!el)return;el.innerHTML=asStateHtml()}

async function exportSessions(kind){const c=cls();if(!c)return;const pack={app:"registre-classe",v:1,kind:"partial",date:S.date,classes:{},days:{},notes:{}};

      pack.classes[cc.id]=JSON.parse(JSON.stringify(cc));pack.days[cc.id]={};got.forEach(k=>pack.days[cc.id][k]=days[k]);pack.notes[cc.id]=nts};
    if(kind==="sess")await add(c,[dk()]);
    else for(const cc of classList()){const keys=[];if((cc.slots||[]).some(x=>+x.d===wd(S.date)))keys.push(S.date);(cc.extras||[]).forEach(x=>{if(x.date===S.date)keys.push("X-"+x.id)});if(keys.length)await add(cc,keys)}}

const NAMEH=/^(nom|pr[ée]nom|nom\s*(et|&)\s*pr[ée]nom|nom\s*complet|[ée]l[èe]ve|apprenant|الاسم|النسب|الاسم\s*الكامل|اسم\s*التلميذ|التلميذ|الإسم|الاسم\s*و\s*النسب|النسب\s*و\s*الاسم)(?![A-Za-z])/i;

function stuBlocks(rows,src){const B=[];let cur=null,head=null;const W=Math.max(0,...rows.map(r=>r.length));

    const ne=r.filter(x=>String(x||"").trim());if(ne.length<=2){const n=ne.map(x=>CLS_STRICT.test(String(x).trim())?clsNorm(x):null).find(Boolean);if(n)return n}return null};

async function stuFileParse(f){const nm=f.name.toLowerCase();const fromName=clsIn(f.name.replace(/\.[a-z0-9]+$/i,"").replace(/_/g," "));let B=[];

function stuImpCard(){const I=S.stuImp;let h=`<div class="card form" id="stuImpCard"><h2>Importer des listes d'élèves · استيراد لوائح التلاميذ</h2>

function massarMerge(c,L){const st=[...(c.students||[])].map(x=>({...x}));const used=new Set();let upd=0,add=0;const mis=[];

const PG_T=/^(le[çc]ons?|chapitres?|titres?|contenus?|activit[ée]s?|s[ée]quences?|unit[ée]s?|الدرس|الدروس|عنوان|المحتوى|المحتويات|الوحدة|الوحدات)/i,PG_N=/(nombre|nb|s[ée]ances|heures|dur[ée]e|عدد|الحصص|المدة|الغلاف|ساعات)/i;
const PG_SKIP=/^(semaine|p[ée]riode|semestre|th[èe]me|domaine|mois|date|n°?|الأسبوع|الأسابيع|المجال|الأسدس|الشهر|التاريخ|الفترة)$/i;
const pgNum=t=>{const m=ND(t).match(/(\d{1,2})\s*(h|heures?|s[ée]ances?|حصص|حصة|ساعات|ساعة|س)(?![a-z])/i);return m?+m[1]:null};
function pgFromRows(rows){const out=[];let tc=-1,nc=-1;
  for(const r0 of rows){const r=r0.map(x=>String(x??"").replace(/\s+/g," ").trim());if(!r.some(Boolean))continue;
    const hi=r.findIndex(x=>PG_T.test(x)&&x.length<30);if(hi>=0&&r.filter(Boolean).length>1){tc=hi;nc=r.findIndex(x=>PG_N.test(x)&&x.length<30);continue}
    let t="",n=null;
    if(tc>=0){t=r[tc]||"";if(nc>=0){const v=ND(r[nc]||"").match(/\d{1,2}/);if(v)n=+v[0]}}
    else{const C=r.filter(x=>x&&/[A-Za-z؀-ۿ]{3}/.test(x)&&!PG_SKIP.test(x)&&!/^\d/.test(ND(x)));t=C.sort((a,b)=>b.length-a.length)[0]||"";const nn=r.map(x=>ND(x)).find(x=>/^\d{1,2}\s*(h|s|س|حصص|حصة)?$/i.test(x)&&+x.match(/\d+/)[0]<=20);if(nn)n=+nn.match(/\d+/)[0]}
    if(!t)continue;if(n==null)n=pgNum(t);t=t.replace(/\(?\s*\d{1,2}\s*(h|heures?|s[ée]ances?|حصص|حصة|ساعات|ساعة|س)\s*\)?/gi,"").replace(/^\s*(\d{1,2}|[ivx]+)\s*[-.)–:]\s*/i,"").replace(/\s+/g," ").trim();
    if(t.length<3||PG_T.test(t)||PG_SKIP.test(t))continue;const l=out[out.length-1];if(l&&l.t===t){l.n+=n||1;continue}out.push({t,n:n||1})}
  return out}
async function pgFileParse(f){const nm=f.name.toLowerCase();let rows=[];
  if(/\.pdf$/.test(nm)){const P=await pdfPages(f);P.forEach(W=>{const L=mergeTokens(W);const lines=[];L.forEach(w=>{let r=lines.find(r=>Math.abs(r.y-w.y)<Math.max(2.5,w.h*.4));if(!r){r={y:w.y,c:[]};lines.push(r)}r.c.push(w)});
    lines.sort((a,b)=>a.y-b.y).forEach(r=>{const rtl=r.c.filter(w=>w.dir==="rtl").length>r.c.length/2;r.c.sort((a,b)=>rtl?b.x-a.x:a.x-b.x);rows.push([r.c.map(w=>w.t).join(" ")])})})}
  else if(/\.docx$/.test(nm)){const W=await docxItems(f);const R=[];W.forEach(w=>{const y=Math.floor(w.y),x=Math.floor(w.x0);(R[y]=R[y]||[])[x]=w.t});rows=R.filter(Boolean).map(r=>Array.from(r,x=>x||""));
    if(!rows.length){const get=await unzipXlsx(await f.arrayBuffer());const xml=await get("word/document.xml")||"";rows=[...new DOMParser().parseFromString(xml,"application/xml").getElementsByTagName("w:p")].map(p=>[p.textContent])}}

  else{const T=await readTable(f);rows=T.extra&&T.extra.length?T.extra:T}
  return pgFromRows(rows)}

function statsCard(c,T){const R=T.rows,n=R.length,D=T.dates.length;if(!n||!D)return "";
  const sum=k=>R.reduce((s,r)=>s+(r[k]||0),0);const A=sum("A"),Rt=sum("R"),seen=R.reduce((s,r)=>s+r.seen,0);
  const pres=seen?Math.round((seen-A)/seen*100):0;const ex=sum("exD"),exn=sum("exN"),pl=sum("plus"),nrr=sum("nr"),mi=sum("minus"),cA=sum("cA"),cI=sum("cI");
  const top=(k,lab,f=r=>r[k])=>{const L=R.filter(r=>f(r)>0).sort((a,b)=>f(b)-f(a)).slice(0,3);return L.length?`<div><b style="font-size:.85rem">${lab}</b><ol style="margin:2px 0 0;padding-left:1.3em;font-size:.85rem">${L.map(r=>`<li>${esc(r.name)} <span class="hint">(${f(r)})</span></li>`).join("")}</ol></div>`:""};
  const per=S.period==="custom"?`du ${S.pFrom?fmtD(S.pFrom):"début"} au ${S.pTo?fmtD(S.pTo):"aujourd'hui"}`:PER[S.period||"year"];
  const k=(v,l)=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
  return `<div class="card form"><h2>Statistiques · ${esc(per)}</h2><span class="hint">${D} séance(s) · ${n} élèves</span>
  <div class="kpis">${k(pres+" %","Présence")+k(A,"Absences")+k(Rt,"Retards")+k(ex,"Exercices faits")+k(exn,"Exercices non faits")+k("+"+pl,"Bonnes réponses")+k("✗"+nrr,"Sans réponse")+k(pl+nrr?Math.round(pl/(pl+nrr)*100)+" %":"–","Taux de réponse")+k("−"+mi,"Comportement")+k(cA,"Cahiers absents")+k(cI,"Cahiers incomplets")+k((ex/D).toFixed(1),"Exercices / séance")}</div>
  <div class="grid2" style="gap:10px">${timerStats(c,T.dates)}${top("plus","Les plus participatifs (+)")}${top("nr","Le plus souvent sans réponse")}${top("exD","Le plus d'exercices faits")}${top("exN","Exercices non faits")}${top("A","Le plus d'absences")}${top("minus","Comportement à surveiller")}${top("c","Cahier à surveiller",r=>(r.cA||0)+(r.cI||0))}${top("R","Le plus de retards")}</div></div>`}

/* ---------- Évaluations : analyses ---------- */
const EVC=["#2b6cb0","#c05621","#2f855a","#9b2c2c","#6b46c1","#2c7a7b","#b7791f","#4a5568"];

function evPer(){const E=S.ev||(S.ev={scope:"classe",per:S.period||"year",src:"all",from:"",to:"",rep:{lvl:true,cls:true,stu:false}});return E}
function inEv(c,d){const E=evPer();if(E.per==="custom")return (!E.from||d>=E.from)&&(!E.to||d<=E.to);return inPeriod(c,d,E.per)}
const exOfC=c=>{const P=evPer().per;return (c.exams||[]).filter(e=>e.slot&&(P==="s1"||P==="s2")?e.slot.startsWith(P.toUpperCase()):inEv(c,e.date)).sort((a,b)=>(a.slot&&b.slot?a.slot.localeCompare(b.slot):a.date.localeCompare(b.date)))};
const tsOfC=c=>(c.tests||[]).filter(t=>inEv(c,t.date)).sort((a,b)=>a.date.localeCompare(b.date));
function stat(a){a=a.filter(x=>x!=null&&!isNaN(x));const n=a.length;if(!n)return {n:0};const m=a.reduce((x,y)=>x+y,0)/n;const s2=[...a].sort((x,y)=>x-y);const med=n%2?s2[(n-1)/2]:(s2[n/2-1]+s2[n/2])/2;const sd=Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/n);return {n,mean:m,med,sd,min:s2[0],max:s2[n-1]}}
const f1=(v,d=2)=>v==null||isNaN(v)?"–":(+v).toFixed(d).replace(".",",");
const stuEx=(c,sid)=>exOfC(c).map(e=>({e,v:((e.res||{})[sid]||{}).note})).filter(x=>x.v!=null);

function clsStats(c){const st=c.students||[];const avgs=st.map(s=>{const a=stat(stuEx(c,s.id).map(x=>x.v));return a.n?a.mean:null});const pls=st.map(s=>{const a=stat(stuTs(c,s.id).map(x=>x.v));return a.n?a.mean:null});
  const allN=exOfC(c).flatMap(e=>Object.values(e.res||{}).map(r=>r.note)).filter(x=>x!=null);const allP=tsOfC(c).flatMap(t=>Object.values(t.res||{}).map(r=>r.pc)).filter(x=>x!=null);
  const S1=stat(allN),P1=stat(allP);const cd=compDist(c);return {c,n:st.length,ex:exOfC(c).length,ts:tsOfC(c).length,N:S1,P:P1,pass:allN.length?100*allN.filter(x=>x>=10).length/allN.length:null,ppass:allP.length?100*allP.filter(x=>x>=50).length/allP.length:null,avgs,pls,cd}}
function compDist(c,sid){const by={};if(!isPion(c))return {L:[],T:{A:0,B:0,C:0,D:0,t:0}};exOfC(c).forEach(e=>(e.comps||[]).forEach((k,i)=>{const o=by[k.code]||(by[k.code]={code:k.code,name:k.name,A:0,B:0,C:0,D:0,t:0});Object.entries(e.res||{}).forEach(([id,r])=>{if(sid&&id!==sid)return;const v=(r.comp||[])[i];if(o[v]!==undefined){o[v]++;o.t++}})}));

/* graphiques SVG */
function hBars(items,max,unit,ref){if(!items.length)return "";const W=360,rh=24,lw=110,H=items.length*rh+18;const sx=v=>lw+(W-lw-40)*Math.max(0,v)/max;

function stackBars(rows){if(!rows.length)return "";const W=360,rh=24,lw=110,H=rows.length*rh+4;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${rows.map((r,i)=>{let x=lw;const t=r.t||1;return `<text x="${lw-6}" y="${i*rh+16}" text-anchor="end">${esc(String(r.label).slice(0,18))}</text>`+["A","B","C","D"].map(k=>{const w=(W-lw-4)*r[k]/t;const h=w>0?`<rect x="${x}" y="${i*rh+5}" width="${w}" height="15" fill="${LVC[k]}"><title>${k} : ${Math.round(100*r[k]/t)} % (${r[k]})</title></rect>${w>22?`<text x="${x+w/2}" y="${i*rh+16}" text-anchor="middle" fill="#fff" style="fill:#fff">${Math.round(100*r[k]/t)}%</text>`:""}`:"";x+=w;return h}).join("")}).join("")}</svg>`}
function lineChart(series,ymax,unit,ref){const pts=series.flatMap(s=>s.pts);if(!pts.length)return "";const ds=[...new Set(pts.map(p=>p.x))].sort();if(ds.length<1)return "";
  const W=360,H=180,l=30,r=26,t=10,b=34;const xi=d=>ds.length===1?l+(W-l-r)/2:l+(W-l-r)*ds.indexOf(d)/(ds.length-1);const yi=v=>t+(H-t-b)*(1-v/ymax);

      <label class="proflab">Nom · الاسم<input id="profName" value="${esc(nw?"":p.name)}" placeholder="ex. Prof. Ahmed" style="width:100%"></label>
      ${!nw&&p.pin?`<label class="proflab">Code PIN actuel<input id="profOld" type="password" inputmode="numeric" autocomplete="off" style="width:100%"></label>`:""}
      <label class="proflab">${nw?"Code PIN (facultatif)":"Nouveau code PIN (vide = "+(p.pin?"garder":"aucun")+")"}<input id="profNew" type="password" inputmode="numeric" autocomplete="off" style="width:100%"></label>
      ${!nw&&p.pin?`<label class="proflab" style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" id="profNoPin"> Supprimer le code PIN</label>`:""}
      <div class="proferr">${esc(st.err)}</div>
      <div class="profact"><button class="btn" data-pb="1">← Retour</button>${!nw&&L.length>1?`<button class="btn danger" data-pdel="1">Supprimer</button>`:""}<button class="btn primary" data-psave="1">Enregistrer</button></div>`}
    el.innerHTML=h+"</div>";const f=el.querySelector("#profPin,#profName");if(f)f.focus()};
  st.repaint=paint;el.addEventListener("cfgedit",()=>{st.mode="cloud";st.cfgEdit=true;st.err="";paint()});
  const pick=p=>{el.remove();onPick(p)};
  el.onclick=async e=>{const b=e.target.closest("button");if(!b)return;const L=o.list;
    if(b.dataset.pp){const p=L.find(x=>x.id===b.dataset.pp);if(!p)return;if(!p.pin)return pick(p);Object.assign(st,{mode:"pin",sel:p,err:"",busy:null,cfgEdit:false});return paint()}
    if(b.dataset.pn){Object.assign(st,{mode:"new",sel:null,err:"",busy:null,cfgEdit:false});return paint()}
    if(b.dataset.pc){st.mode="cloud";st.sel=null;st.err="";st.busy=null;st.cfgEdit=false;paint();return cloudPrep(st)}
    if(b.dataset.cl){return cloudAct(b.dataset.cl,st,o,u=>{el.remove();onPick({cloud:true,user:u})})}
    if(b.dataset.pe){Object.assign(st,{mode:"edit",sel:L.find(x=>x.id===b.dataset.pe),err:"",busy:null,cfgEdit:false});return paint()}
    if(b.dataset.pb){Object.assign(st,{mode:"list",sel:null,err:"",busy:null,cfgEdit:false});return paint()}
    if(b.dataset.pok){const v=$("#profPin").value;if(pinHash(st.sel.id,v)===st.sel.pin)return pick(st.sel);st.err="Code incorrect";return paint()}
    if(b.dataset.psave){const nm=$("#profName").value.trim(),nv=$("#profNew").value.trim();
      if(!nm){st.err="Entrez un nom";return paint()}
      if(L.some(x=>x!==st.sel&&x.name.toLowerCase()===nm.toLowerCase())){st.err="Ce nom existe déjà";return paint()}
      if(st.mode==="new"){const id="p"+uid();L.push({id,name:nm,pin:nv?pinHash(id,nv):"",suf:":"+id});profWrite(o);Object.assign(st,{mode:"list",sel:null,err:"",busy:null,cfgEdit:false});toast("Compte créé");return paint()}
      const p=st.sel;if(p.pin){const ov=$("#profOld").value;if(pinHash(p.id,ov)!==p.pin){st.err="Code PIN actuel incorrect";return paint()}}
      p.name=nm;if(nv)p.pin=pinHash(p.id,nv);else if($("#profNoPin")&&$("#profNoPin").checked)p.pin="";
      profWrite(o);if(PR.cur&&PR.cur.id===p.id)PR.cur=p;Object.assign(st,{mode:"list",sel:null,err:"",busy:null,cfgEdit:false});toast("Compte modifié");return paint()}
    if(b.dataset.pdel){const p=st.sel;if(p.pin){const ov=$("#profOld")?$("#profOld").value:"";if(pinHash(p.id,ov)!==p.pin){st.err="Entrez le code PIN actuel pour supprimer";return paint()}}
      if(!confirm(`Supprimer le compte « ${p.name} » et TOUTES ses données (classes, élèves, notes, sauvegardes auto) sur cet appareil ?\n\nCette action est définitive.`))return;
      if(!confirm("Confirmer la suppression définitive ?"))return;
      try{localStorage.removeItem("rc-local"+(p.suf||""));localStorage.removeItem("rc-ui"+(p.suf||""))}catch(e){}
      try{await idb.set("snaps"+(p.suf||""),[]);await idb.set("file"+(p.suf||""),null)}catch(e){}
      o.list=L.filter(x=>x!==p);profWrite(o);Object.assign(st,{mode:"list",sel:null,err:"",busy:null,cfgEdit:false});toast("Compte supprimé");return paint()}};
  el.onkeydown=e=>{if(e.key==="Enter"&&e.target.tagName!=="TEXTAREA"){const b=el.querySelector("[data-pok],[data-psave],[data-cl=login]");if(b)b.click()}};
  paint();if(st.mode==="cloud")cloudPrep(st)}
document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest("#profBtn")){
  const go=()=>{try{sessionStorage.removeItem("rc-cur");sessionStorage.setItem("rc-ask","1")}catch(e){}location.reload()};
  if(AS.dirty&&api&&api.local){asRun().then(go,go)}else go()}});

/* ---------- Démarrage ---------- */
function start(a){api=demoWrap(a);try{if(api.subLive)api.subLive(v=>{if(!v||v.by===DEV||(v.ts||0)<=(dispState().ts||0))return;const old=dispState();S.disp=v;if(v.pick&&(!old.pick||old.pick.at!==v.pick.at)&&S.tab==="seance"){}dispPaint();if(S.tab==="seance"&&S.store==="ok")render()})}catch(e){}try{api.subProgramme(o=>{S.progOwn=o;progRecalc();if(S.store==="ok")render()})}catch(e){}try{if(api.subShared)api.subShared(o=>{S.sh=o||{};shApply();if(S.store==="ok")render()})}catch(e){}try{api.subCalendar(o=>{S.holOwn=(o&&o.rel)||{};S.schedOwn=(o&&o.sched)||null;S.mods=(o&&o.mods)||{};calApply();if(S.store==="ok")render()})}catch(e){}api.subClasses(o=>{S.classes=o;S.store="ok";
  if(!S.auto){S.auto=1;const h=autoPick();if(h){S.date=today();S.xid=h.x||null;S.tab="seance";saveUI();return selectClass(h.cid)}}
  if(!S.cid||!o[S.cid]){const first=Object.keys(o).sort((x,y)=>(o[x].name||"").localeCompare(o[y].name||""))[0]||null;selectClass(first)}
  else if(!unsubDays)selectClass(S.cid); else render()})}
render();
(async()=>{let db=null;
  if(db){setSync("Connexion…");start(dbApi(db))}else{const g=await profGate();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}if(g&&g.cloud){setSync("☁️ Connexion…");start(cloudApi(g.user))}else{await asLoad();start(localApi());setSync(PR.cur?("Compte : "+PR.cur.name):"Enregistré sur cet appareil")}}})();
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
